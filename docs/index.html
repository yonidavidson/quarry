<!doctype html>
<!--
  QUARRY's permanent address. The game itself moved off GitHub Pages when it was
  rebuilt in three.js on Genex, so this page is the one stable link — the README
  and every link ever shared point here, and only this file knows where the game
  actually lives today.

  THIS IS THE ONE PLACE TO EDIT when the game moves. The game is published, so
  the target is its world page (/world/<slug>) — a draft would be /draft/<slug>,
  which opens for its owner only.

  GitHub Pages serves this folder (Settings → Pages → main /docs). The repo root
  is the Vite source now, which a static host cannot run.
-->
