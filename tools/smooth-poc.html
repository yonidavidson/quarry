const ANIMS = [
  { name:"idle", f:0, t:3, spd:4 },
  { name:"run",  f:4, t:11, spd:17 },
  { name:"climb",f:13, t:20, spd:11 },
  { name:"crawl",f:26, t:29, spd:7 },
];
const FW = 130, FH = 233, SX = 65;
const img = new Image();
let startTime, live;

img.onload = () => {
  startTime = performance.now();
  info.textContent = "IDLE — frame 0.00";
  live = setInterval(step, 16);
};
img.onerror = () => { info.textContent = "IMG FAIL"; };
img.src = HUMAN_PNG;

let frames = 0, lastFps = performance.now();
function step() {
  const now = performance.now();
  const t = (now - startTime) / 1000;
  const sw = 3;
  const cyc = t / sw;
  const idx = Math.floor(cyc) % ANIMS.length;
  const lt = cyc - Math.floor(cyc);
  const d = ANIMS[idx];
  const range = d.t - d.f + 1;
  const ff = d.f + lt * range;

  const f0 = Math.floor(ff);
  const f1 = Math.min(f0 + 1, d.t);
  const blend = ff - f0;
  const px = (i) => ({ x: (i % SX) * FW, y: Math.floor(i / SX) * FH });

  ctx.clearRect(0, 0, 640, 480);
  ctx.fillStyle = "#141216";
  ctx.fillRect(0, 470, 640, 10);

  const cx = 320 - FW*1.5;
  const cy = 280 - FH*1.5;
  const sc = 3;

  const a = px(f0), b = px(f1);
  ctx.drawImage(img, a.x, a.y, FW, FH, cx, cy, FW*sc, FH*sc);
  if (blend > 0.01) {
    ctx.globalAlpha = blend;
    ctx.drawImage(img, b.x, b.y, FW, FH, cx, cy, FW*sc, FH*sc);
    ctx.globalAlpha = 1;
  }

  info.textContent = d.name.toUpperCase() + "  frame " + ff.toFixed(2);

  frames++;
  if (now - lastFps > 1000) {
    fpsEl.textContent = frames + " FPS";
    frames = 0;
    lastFps = now;
  }
}
